[project]
name = "zelos-extension-mqtt"
version = "0.1.1"
description = "Subscribe to topics on an MQTT broker and record JSON, number, boolean or text payloads as typed signals. Publish messages at QoS 0 to 2 and add topics while running. Built-in demo broker."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zelos", "extension", "mqtt", "iot"]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "aiomqtt>=2.3.0",
    "amqtt>=0.11.0b1",
    "rich-click>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-mqtt"
Repository = "https://github.com/zeloscloud/zelos-extension-mqtt"
Issues = "https://github.com/zeloscloud/zelos-extension-mqtt/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_mqtt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
