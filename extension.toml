name = "MQTT"
version = "0.1.1"
description = "Subscribe to topics on an MQTT broker and record JSON, number, boolean or text payloads as typed signals. Publish messages at QoS 0 to 2 and add topics while running. Built-in demo broker."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-mqtt"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["mqtt", "iot", "messaging", "broker", "pub sub", "pubsub", "publish subscribe", "qos", "telemetry", "sensor", "message broker", "m2m", "json payload", "device map", "username password", "embedded broker"]
categories = ["IoT", "Industrial", "Networking"]
icon = "assets/icon.svg"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_mqtt", "CHANGELOG.md"]
