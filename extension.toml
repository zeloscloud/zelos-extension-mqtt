name = "MQTT"
version = "0.2.0"
description = "Trace every topic on one or more MQTT brokers, or map topics to typed signals with a device map. TLS and client certificates, publish and subscribe actions, auto-configure, built-in demo broker."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-mqtt"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["mqtt", "iot", "messaging", "broker", "pub sub", "pubsub", "publish subscribe", "qos", "telemetry", "sensor", "message broker", "m2m", "json payload", "device map", "tls", "mtls", "embedded broker"]
categories = ["IoT", "Industrial", "Networking"]
icon = "assets/icon.svg"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_mqtt", "CHANGELOG.md"]
